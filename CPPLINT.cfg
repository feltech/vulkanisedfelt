set noparent
# Covered by clang-format:
#   whitespace/line_length
#   whitespace/braces
#   whitespace/indent_namespace
#   whitespace/indent
#   whitespace/newline
# Others:
#   readability/nolint - allow clang-tidy NOLINT error categories.
filter=-whitespace/line_length,-whitespace/braces,-whitespace/indent_namespace,-readability/nolint
filter=-whitespace/indent,-whitespace/newline
